
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>عـلـي TV | البث المباشر</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #050914;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 12px;
  text-align: center;
  background: linear-gradient(135deg, #142b45, #050914);
  border-bottom: 1px solid #16435c;
}

.logo {
  color: #35e5ff;
  font-size: 32px;
  font-weight: 900;
  text-shadow: 0 0 18px #008cff80;
}

.subtitle {
  color: #bdcad8;
  font-size: 13px;
  margin-top: 8px;
}

.live {
  display: inline-block;
  margin-top: 13px;
  padding: 7px 15px;
  color: #ff6678;
  background: #24111b;
  border: 1px solid #67263a;
  border-radius: 30px;
  font-size: 12px;
}

main {
  width: 100%;
  max-width: 950px;
  margin: auto;
  padding: 15px 10px;
}

h2 {
  font-size: 17px;
  margin: 5px 0 14px;
}

.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
  border: 1px solid #16435c;
  border-radius: 12px;
}

.player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  justify-content: center;
  margin-top: 15px;
}

button {
  padding: 12px 16px;
  color: white;
  background: #10253a;
  border: 1px solid #1e607c;
  border-radius: 10px;
  font-size: 13px;
  font-weight: bold;
}

button.primary {
  background: linear-gradient(135deg, #00c8df, #0877d1);
  color: #00121b;
}

.info {
  margin-top: 16px;
  padding: 15px;
  background: #0d1726;
  border: 1px solid #1b344b;
  border-radius: 12px;
  color: #b9c9da;
  font-size: 13px;
  line-height: 1.9;
}

.info strong {
  color: #35e5ff;
}

footer {
  text-align: center;
  padding: 22px 10px;
  color: #778ba0;
  font-size: 12px;
}

body.fullscreen-page header,
body.fullscreen-page h2,
body.fullscreen-page .buttons,
body.fullscreen-page .info,
body.fullscreen-page footer {
  display: none;
}

body.fullscreen-page main {
  max-width: none;
  padding: 0;
}

body.fullscreen-page .player {
  width: 100%;
  height: 100dvh;
  aspect-ratio: auto;
  border: 0;
  border-radius: 0;
}

@media (max-width: 480px) {
  .logo { font-size: 28px; }
  main { padding: 12px 7px; }
  button { padding: 11px 12px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">عـلـي TV</div>
  <div class="subtitle">عالم المشاهدة في مكان واحد</div>
  <div class="live">🔴 مشغّل الفيديو</div>
</header>

<main>
  <h2>📺 القناة المباشرة</h2>

  <div class="player" id="player">
    <iframe
      id="stream"
      src="https://customer-dv8hv6jk17xmgvz7.cloudflarestream.com/dffd36818b7759341811f0dd1386230f/iframe"
      title="عـلـي TV"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="buttons">
    <button class="primary" onclick="goFullscreen()">
      ⛶ ملء الشاشة
    </button>

    <button onclick="reloadPlayer()">
      ↻ إعادة تحميل
    </button>

    <button onclick="toggleInterface()">
      ◉ إخفاء الواجهة
    </button>
  </div>

  <div class="info">
    <strong>أهلاً وسهلاً بكم في عـلـي TV 🤩</strong>
    <p>
      اضغط زر التشغيل داخل الفيديو لبدء المشاهدة.
      إذا لم يعمل البث، تحقق من توفر الفيديو وصلاحية رابط المشغّل.
    </p>
  </div>
</main>

<footer>
  © 2026 عـلـي TV
</footer>

<script>
const STREAM_URL =
  "https://customer-dv8hv6jk17xmgvz7.cloudflarestream.com/dffd36818b7759341811f0dd1386230f/iframe";

function reloadPlayer() {
  document.getElementById("stream").src = STREAM_URL;
}

function goFullscreen() {
  const frame = document.getElementById("stream");

  try {
    if (frame.requestFullscreen) {
      frame.requestFullscreen().catch(() => {});
    } else {
      document.getElementById("player").scrollIntoView();
    }
  } catch (e) {
    document.getElementById("player").scrollIntoView();
  }
}

function toggleInterface() {
  document.body.classList.toggle("fullscreen-page");
}
</script>

</body>
</html>
